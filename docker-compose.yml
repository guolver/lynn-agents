services:
  api:
    build: .
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql+psycopg://agent_hub:agent_hub@postgres:5432/agent_hub
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-agent_hub_graph}
      PUBLIC_BASE_URL: http://localhost:8000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      FILE_PARSER_URL: http://file-parser:8001
    depends_on:
      file-parser:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - default
      - parser-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  file-parser:
    build:
      context: ./agent_hub/file_parser
      dockerfile: Dockerfile
    expose:
      - '8001'
    # 资源限制
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 1
    # 安全加固
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 网络隔离：只能被内部服务访问
    networks:
      - parser-internal
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - api
    environment:
      - AGENT_HUB_API_URL=http://host.docker.internal:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  worker:
    build: .
    command: ["celery", "-A", "agent_hub.worker.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      - ./src:/app/src
    environment:
      DATABASE_URL: postgresql+psycopg://agent_hub:agent_hub@postgres:5432/agent_hub
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SYNC_INTERVAL_HOURS: "1"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: ["celery", "-A", "agent_hub.worker.celery_app:celery_app", "beat", "--loglevel=info"]
    volumes:
      - ./src:/app/src
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SYNC_INTERVAL_HOURS: "1"
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agent_hub
      POSTGRES_PASSWORD: agent_hub
      POSTGRES_DB: agent_hub
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_hub"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-agent_hub_graph}
      GRAPH_HEALTH_USER: neo4j
      GRAPH_HEALTH_PASSWORD: ${NEO4J_PASSWORD:-agent_hub_graph}
    ports:
      - '127.0.0.1:7687:7687'
      - '127.0.0.1:7474:7474'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$$GRAPH_HEALTH_USER\" -p \"$$GRAPH_HEALTH_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  parser-internal:
    internal: true  # 无外网访问，只能内部通信

volumes:
  pg_data:
  redis_data:
  neo4j_data:
