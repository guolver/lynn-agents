services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent_hub
      POSTGRES_PASSWORD: agent_hub
      POSTGRES_DB: agent_hub
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_hub"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-agent_hub_graph}
      GRAPH_HEALTH_USER: neo4j
      GRAPH_HEALTH_PASSWORD: ${NEO4J_PASSWORD:-agent_hub_graph}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $$GRAPH_HEALTH_USER -p $$GRAPH_HEALTH_PASSWORD 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pg_data:
  redis_data:
  neo4j_data:
