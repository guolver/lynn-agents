name: Auto Fix CI Errors

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: auto-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  auto-fix:
    # Only run on failure, not on auto-fix commits
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
      !contains(github.event.workflow_run.head_commit.message, 'auto-fix')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Check retry count
        id: retry
        run: |
          count=$(git log -3 --oneline --grep="auto-fix" | wc -l)
          echo "count=$count" >> $GITHUB_OUTPUT
          if [ "$count" -ge 2 ]; then
            echo "::warning::Too many auto-fix attempts (${count}), stopping"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Get failed logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Failed CI Run #${{ github.event.workflow_run.id }}" > errors.log
          echo "Branch: ${{ github.event.workflow_run.head_branch }}" >> errors.log
          echo "" >> errors.log
          gh run view ${{ github.event.workflow_run.id }} --log-failed >> errors.log 2>&1 || true
          tail -500 errors.log > errors_truncated.log && mv errors_truncated.log errors.log
          echo "=== Error Preview (first 50 lines) ==="
          head -50 errors.log

      - name: Run AI fix
        env:
          # 支持多种 API (按优先级)
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.OPENAI_API_KEY || secrets.ANTHROPIC_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-chat' }}
        run: |
          pip install openai -q
          python scripts/ai-fix.py errors.log

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes made"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "AI Auto-Fix"
          git config user.email "ai-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): auto-fix errors [skip ci]

          Fixed by AI from CI run #${{ github.event.workflow_run.id }}
          Model: ${{ vars.LLM_MODEL || 'deepseek-chat' }}"
          git push

      - name: Trigger CI rerun
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          sleep 5
          gh workflow run ci.yml --ref ${{ github.event.workflow_run.head_branch }} || true
