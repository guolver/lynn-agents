[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-hub"
version = "0.2.0"
description = "Extensible platform for registering and invoking auditable business agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.16,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "langfuse>=3,<4",
  "neo4j>=5.20,<6",
  "openai>=1.30",
  "pgvector>=0.3,<1",
  "pydantic>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=4.0",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "ruff>=0.8,<1", "testcontainers[neo4j]>=4.9,<5"]
mcp = ["mcp>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hub"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
